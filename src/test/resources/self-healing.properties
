# HEALING_MODE: AUTO (heals & updates Java file + .backup) or SAFE (reports proposal only)
HEALING_MODE=SAFE

# Free / Local AI (Ollama)
AI_PROVIDER=ollama
AI_MODEL=llama3.2
OLLAMA_URL=http://localhost:11434
ENABLE_LOCAL_LLM=true
ENABLE_EMBEDDINGS=true

# Security & Reporting
REDACT_SENSITIVE_DATA=true
SOURCE_BACKUP_ENABLED=true
REPORT_OUTPUT_FILE=reports/self-healing-report.html